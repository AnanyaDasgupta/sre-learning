apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  # name must match the spec fields below, and be in the form: <plural>.<group>
  name: scalers.ops.one2n.in
spec:
  # group name to use for REST API: /apis/<group>/<version>
  group: ops.one2n.in
  # list of versions supported by this CustomResourceDefinition
  versions:
    - name: v1alpha1
      # Each version can be enabled/disabled by Served flag.
      served: true
      # One and only one version must be marked as the storage version.
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema: # the structural blueprint used within a CustomResourceDefinition (CRD) to validate, prune, and define the schema of your custom resources.
          type: object
          properties:
            spec:
              type: object
              required: [deploymentName, replicas]
              properties:
                deploymentName:
                  type: string
                  minLength: 1
                replicas:
                  type: integer
                  minimum: 0
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
  
  # either Namespaced or Cluster
  scope: Namespaced
  names:
    # plural name to be used in the URL: /apis/<group>/<version>/<plural>. Dictates the http path used by the api server to expose, route, and manage our custom resources.
    plural: scalers
    # singular name to be used as an alias on the CLI and for display
    singular: scaler
    # kind is normally the CamelCased singular type. Your resource manifests use this.
    kind: Scaler  
    # shortNames allow shorter string to match your resource on the CLI
    shortNames:
    - sclr

